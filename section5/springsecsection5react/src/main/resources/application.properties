spring.application.name=${SPRING_APP_NAME:eazybankbackendreact}
logging.level.org.springframework.security=TRACE

# R2DBC H2 Configuration (reactive equivalent of JDBC datasource)
# In MVC, we use spring.datasource.url with jdbc:mysql://...
# In WebFlux with R2DBC, we use spring.r2dbc.url with r2dbc:h2:mem://...
spring.r2dbc.url=r2dbc:h2:mem:///eazybank
spring.r2dbc.username=sa
spring.r2dbc.password=

# Enable SQL initialization to run schema.sql on startup.
# R2DBC doesn't support JPA's auto-DDL, so we use Spring's SQL init scripts.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 needs a JDBC URL for schema initialization (Spring uses JDBC to run init scripts)
spring.datasource.url=jdbc:h2:mem:eazybank;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
logging.level.root=TRACE
