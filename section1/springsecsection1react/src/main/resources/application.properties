# Application name
spring.application.name=${SPRING_APP_NAME:springsecsection1react}

# Default security user credentials (same as MVC version).
# When Spring Security is on the classpath, ALL endpoints are secured by default.
# These credentials let you authenticate via HTTP Basic or the auto-generated login page.
spring.security.user.name=${SECURITY_USERNAME:eazybytes}
spring.security.user.password=${SECURITY_PASSWORD:12345}

# Enable TRACE-level logging for Spring Security to see the reactive security filter chain in action.
# In WebFlux, security filters are WebFilter instances (not servlet Filters).
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
