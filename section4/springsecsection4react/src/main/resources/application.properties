spring.application.name=${SPRING_APP_NAME:eazybankbackendreact}
logging.level.org.springframework.security=TRACE

# R2DBC MySQL Configuration
# Switched from H2 to MySQL to maintain consistency with the MVC project and 
# avoid 'Bad SQL Grammar' issues encountered with R2DBC-H2 syntax mismatches.
spring.r2dbc.url=r2dbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:eazybank}
spring.r2dbc.username=${DATABASE_USERNAME:root}
spring.r2dbc.password=${DATABASE_PASSWORD:root}

# Enable SQL initialization if needed, but usually MySQL schema is pre-created
spring.sql.init.mode=never

logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
